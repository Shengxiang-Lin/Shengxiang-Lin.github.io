<div class="row mt-3">
    <div class="col">
        <div class="card border-0 shadow-sm bg-white">
            <div class="card-body p-4">
                <div class="row">
                    {% if site.data.profile.service %}
                    <div class="col-md-12">
                        <div class="my-1">
                            <h6><i class="fas fa-handshake"></i> &nbsp; {% include i18n.html key="service" %}</h6>
                            <div class="mx-2">
                                <ul class="list small pl-3 mb-1">
                                    <div class="row">
                                        {% for item in site.data.profile.service %}
                                        <div class="col-md-12">
                                            <li>
                                                <em class="lang-en">{{ item.name }}</em><span class="lang-zh">{{ site.data.profile.service_zh[forloop.index0].name }}</span>
                                            </li>
                                        </div>
                                        {% endfor %}
                                    </div>
                                </ul>
                            </div>
                        </div>
                    </div>
                    {% endif %}
                </div>
            </div>
        </div>
    </div>
</div>
